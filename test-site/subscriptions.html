<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YouTube Focus Subscriptions — behavior fixture</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; margin: 0; background: #0f0f0f; color: #f1f1f1; }
      #masthead-container { position: fixed; z-index: 2000; inset: 0 0 auto; height: 56px; background: #0f0f0f; }
      ytd-masthead, ytd-masthead #container { display: flex; width: 100%; height: 56px; align-items: center; }
      ytd-masthead #start { width: 220px; }
      ytd-masthead #center { display: flex; align-items: center; }
      yt-searchbox { display: flex; width: 100%; height: 40px; }
      .ytSearchboxComponentInputBox { flex: 1; border: 1px solid #303030; border-radius: 20px 0 0 20px; background: #212121; }
      .ytSearchboxComponentInput { width: 100%; height: 100%; border: 0; padding: 0 18px; background: transparent; color: #fff; }
      .ytSearchboxComponentSearchButton { width: 64px; border: 1px solid #303030; border-left: 0; border-radius: 0 20px 20px 0; background: #272727; color: #fff; }
      ytd-masthead #end { display: flex; margin-left: auto; align-items: center; gap: 12px; }
      .ytSpecButtonShapeNextHost { border: 0; border-radius: 18px; padding: 9px 14px; background: #272727; color: #fff; }
      .round { width: 36px; height: 36px; border: 0; border-radius: 50%; background: transparent; color: #fff; }
      ytd-page-manager { display: block; padding-top: 56px; }
      ytd-browse, ytd-rich-grid-renderer, #contents { display: block; width: 100%; }
      ytd-rich-grid-renderer > #contents { display: flex; flex-wrap: wrap; padding: 28px 24px; }
      ytd-rich-section-renderer { display: block; width: 100%; margin-bottom: 24px; }
      ytd-rich-shelf-renderer { display: block; padding: 16px; border: 1px solid #444; }
      ytd-rich-item-renderer { display: block; width: calc(100% / var(--ytd-rich-grid-items-per-row, 3)); padding: 8px; }
      .thumb { aspect-ratio: 16 / 9; border-radius: 10px; background: linear-gradient(135deg, #f35, #25f); }
      .title { margin: 10px 0 4px; color: #f1f1f1; font: 600 16px Arial, sans-serif; text-decoration: none; }
      .metadata { margin: 0; color: #aaa; font: 14px Arial, sans-serif; }
      .card-menu { float: right; width: 40px; height: 40px; border: 0; background: transparent; color: #fff; font-size: 24px; }
      ytd-video-preview { position: absolute; z-index: 2100; top: 92px; left: 32px; display: block; width: calc((100vw - 48px) / 4 - 16px); aspect-ratio: 16 / 9; background: linear-gradient(135deg, #111c, #333c); pointer-events: auto; }
      .ytmMuteButtonButton, .ytmClosedCaptioningButtonButton { position: absolute; right: 16px; width: 48px; height: 48px; border: 0; background: #000b; color: #fff; }
      .ytmMuteButtonButton { top: 16px; }
      .ytmClosedCaptioningButtonButton { top: 64px; }
      yt-sheet-view-model { position: fixed; z-index: 4000; top: 120px; right: 30px; display: block; width: 260px; padding: 8px; background: #282828; }
      yt-list-view-model, yt-list-item-view-model { display: block; }
      yt-list-view-model button { width: 100%; border: 0; padding: 12px; background: transparent; color: #fff; text-align: left; }
    </style>
  </head>
  <body>
    <ytd-app>
      <div id="masthead-container">
        <ytd-masthead>
          <div id="container">
            <div id="start">YouTube</div>
            <div id="center">
              <yt-searchbox role="search">
                <div class="ytSearchboxComponentInputBox"><input class="ytSearchboxComponentInput" placeholder="Search"></div>
                <button class="ytSearchboxComponentSearchButton" aria-label="Search">⌕</button>
              </yt-searchbox>
            </div>
            <div id="voice-search-button">Voice</div>
            <div id="end">
              <button class="ytSpecButtonShapeNextHost" data-test-kind="create">＋ Create</button>
              <button class="round" aria-label="Notifications">Bell</button>
              <button class="round" aria-label="Account menu">M</button>
            </div>
          </div>
        </ytd-masthead>
      </div>
      <ytd-page-manager>
        <ytd-browse page-subtype="subscriptions">
          <ytd-rich-grid-renderer>
            <div id="contents">
              <ytd-rich-section-renderer data-test-kind="most-relevant">
                <div id="content">
                  <ytd-rich-shelf-renderer>
                    <div id="dismissible">
                      <div id="rich-shelf-header-container">
                        <div id="rich-shelf-header"><h2><div id="title-container"><div id="title-text"><span id="title">Most relevant</span></div></div></h2></div>
                      </div>
                    </div>
                  </ytd-rich-shelf-renderer>
                </div>
              </ytd-rich-section-renderer>
              <ytd-rich-item-renderer data-test-kind="video-1"><div id="content"><yt-lockup-view-model><a class="ytLockupViewModelContentImage" href="/watch?v=video-1"><div class="thumb"><yt-thumbnail-overlay-progress-bar-view-model><div class="ytThumbnailOverlayProgressBarHostWatchedProgressBarSegment" style="width: 100%"></div></yt-thumbnail-overlay-progress-bar-view-model></div></a><button class="card-menu" aria-label="More actions">⋮</button><h3><a class="title" href="/watch?v=video-1">Video 1 — watched</a></h3><p class="metadata">Channel · 10K views</p></yt-lockup-view-model></div></ytd-rich-item-renderer>
              <ytd-rich-item-renderer data-test-kind="video-2"><div id="content"><yt-lockup-view-model><a class="ytLockupViewModelContentImage" href="/watch?v=video-2"><div class="thumb"><yt-thumbnail-overlay-progress-bar-view-model><div class="ytThumbnailOverlayProgressBarHostWatchedProgressBarSegment" style="width: 55%"></div></yt-thumbnail-overlay-progress-bar-view-model></div></a><button class="card-menu" aria-label="More actions">⋮</button><h3><a class="title" href="/watch?v=video-2">Video 2 — in progress</a></h3><p class="metadata">Channel · 20K views</p></yt-lockup-view-model></div></ytd-rich-item-renderer>
              <ytd-rich-item-renderer data-test-kind="video-3"><div id="content"><yt-lockup-view-model><a class="ytLockupViewModelContentImage" href="/watch?v=video-3"><div class="thumb"></div></a><button class="card-menu" aria-label="More actions">⋮</button><h3><a class="title" href="/watch?v=video-3">Video 3</a></h3><p class="metadata">Channel · 30K views</p></yt-lockup-view-model></div></ytd-rich-item-renderer>
              <ytd-rich-item-renderer data-test-kind="video-4"><div id="content"><yt-lockup-view-model><a class="ytLockupViewModelContentImage" href="/watch?v=video-4"><div class="thumb"></div></a><button class="card-menu" aria-label="More actions">⋮</button><h3><a class="title" href="/watch?v=video-4">Video 4</a></h3><p class="metadata">Channel · 40K views</p></yt-lockup-view-model></div></ytd-rich-item-renderer>
            </div>
          </ytd-rich-grid-renderer>
        </ytd-browse>
      </ytd-page-manager>
    </ytd-app>
    <ytd-video-preview>
      <button class="ytmMuteButtonButton" aria-label="Unmute">♪</button>
      <button class="ytmClosedCaptioningButtonButton" aria-label="Subtitles/CC turned on">CC</button>
    </ytd-video-preview>
    <script>
      document.addEventListener("click", (event) => {
        const menuButton = event.target.closest('button[aria-label="More actions"]');
        if (!menuButton) return;

        document.querySelector("yt-sheet-view-model")?.remove();
        const card = menuButton.closest("ytd-rich-item-renderer");
        const sheet = document.createElement("yt-sheet-view-model");
        const list = document.createElement("yt-list-view-model");
        const item = document.createElement("yt-list-item-view-model");
        const save = document.createElement("button");
        save.setAttribute("role", "menuitem");
        save.textContent = "Save to Watch later";
        save.addEventListener("click", () => {
          card.dataset.watchLaterAdded = "true";
          sheet.remove();
        });
        item.append(save);
        list.append(item);
        sheet.append(list);
        document.body.append(sheet);
      });
    </script>
    <script src="../content.js"></script>
  </body>
</html>
