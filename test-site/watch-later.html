<!doctype html>
<html lang="en" dark>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YouTube Focus Watch Later — behavior fixture</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; margin: 0; background: #0f0f0f; color: #f1f1f1; font: 16px Arial, sans-serif; }
      ytd-browse { display: flex; width: 100%; padding-top: 72px; }
      ytd-playlist-header-renderer { display: block; width: 360px; min-height: 720px; padding: 24px; background: linear-gradient(#6f7d24, #111); }
      ytd-two-column-browse-results-renderer { display: flex; flex: 1; padding-left: 360px; }
      #primary { width: 800px; }
      ytd-alert-with-button-renderer { display: block; height: 56px; padding: 18px; background: #272727; }
      ytd-playlist-video-list-renderer { display: block; width: 760px; }
      ytd-playlist-video-renderer { display: grid; grid-template-columns: 240px 1fr auto; gap: 16px; min-height: 150px; padding: 10px 0; align-items: start; }
      .thumb { aspect-ratio: 16 / 9; border-radius: 8px; background: linear-gradient(135deg, #fd5, #48f); }
      .video-title { display: block; color: #f1f1f1; font-size: 18px; font-weight: 600; text-decoration: none; }
      .video-meta { margin-top: 10px; color: #aaa; }
      #menu { display: flex; align-items: center; }
      ytd-menu-renderer { display: block; }
      ytd-menu-renderer button { width: 40px; height: 40px; border: 0; background: transparent; color: #fff; cursor: pointer; font-size: 24px; }
      ytd-menu-popup-renderer { position: fixed; z-index: 3000; right: 38px; top: 120px; display: block; min-width: 240px; border-radius: 10px; padding: 8px 0; background: #282828; box-shadow: 0 6px 24px #000a; }
      ytd-menu-service-item-renderer { display: block; padding: 12px 16px; cursor: pointer; }
    </style>
  </head>
  <body>
    <ytd-app>
      <ytd-page-manager>
        <ytd-browse page-subtype="playlist">
          <ytd-playlist-header-renderer data-test-kind="hero">Large Watch Later hero</ytd-playlist-header-renderer>
          <ytd-two-column-browse-results-renderer>
            <div id="primary">
              <ytd-alert-with-button-renderer data-test-kind="alert">Unavailable videos</ytd-alert-with-button-renderer>
              <div>Date added (newest)</div>
              <ytd-playlist-video-list-renderer data-test-kind="list">
                <ytd-playlist-video-renderer><div class="thumb"></div><div><a id="video-title" class="video-title">Saved video 1</a><div class="video-meta">Channel one · 12K views</div></div><div id="menu"><ytd-menu-renderer><button aria-label="Action menu">⋮</button></ytd-menu-renderer></div></ytd-playlist-video-renderer>
                <ytd-playlist-video-renderer><div class="thumb"></div><div><a id="video-title" class="video-title">Saved video 2</a><div class="video-meta">Channel two · 48K views</div></div><div id="menu"><ytd-menu-renderer><button aria-label="Action menu">⋮</button></ytd-menu-renderer></div></ytd-playlist-video-renderer>
                <ytd-playlist-video-renderer><div class="thumb"></div><div><a id="video-title" class="video-title">Saved video 3</a><div class="video-meta">Channel three · 7K views</div></div><div id="menu"><ytd-menu-renderer><button aria-label="Action menu">⋮</button></ytd-menu-renderer></div></ytd-playlist-video-renderer>
              </ytd-playlist-video-list-renderer>
            </div>
          </ytd-two-column-browse-results-renderer>
        </ytd-browse>
      </ytd-page-manager>
    </ytd-app>
    <script>
      document.addEventListener("click", (event) => {
        const menuButton = event.target.closest('button[aria-label="Action menu"]');
        if (!menuButton) return;

        document.querySelector("ytd-menu-popup-renderer")?.remove();
        const row = menuButton.closest("ytd-playlist-video-renderer");
        const popup = document.createElement("ytd-menu-popup-renderer");
        popup.setAttribute("role", "menu");
        const removeItem = document.createElement("ytd-menu-service-item-renderer");
        removeItem.setAttribute("role", "menuitem");
        removeItem.textContent = "Remove from Watch later";
        removeItem.addEventListener("click", () => {
          row.remove();
          popup.remove();
        });
        popup.append(removeItem);
        document.body.append(popup);
      });
    </script>
    <script src="../content.js"></script>
  </body>
</html>
