<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YouTube Focus Watch — behavior fixture</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; margin: 0; }
      #masthead-container { position: fixed; z-index: 2000; inset: 0 0 auto; height: 56px; }
      ytd-masthead, ytd-masthead #container { display: flex; width: 100%; height: 56px; align-items: center; }
      ytd-masthead #start, ytd-masthead #end { width: 220px; }
      ytd-masthead #center { display: flex; }
      yt-searchbox { display: flex; width: 100%; height: 40px; }
      yt-searchbox input { width: 100%; border: 1px solid #fff; border-radius: 20px 0 0 20px; padding: 0 18px; background: #000; color: #fff; }
      yt-searchbox button { width: 64px; border: 1px solid #fff; border-left: 0; border-radius: 0 20px 20px 0; background: #000; color: #fff; }
      ytd-page-manager { display: block; padding-top: 56px; }
      #columns { display: flex; flex-wrap: wrap; justify-content: center; gap: 24px; padding: 12px 24px; }
      ytd-watch-flexy { display: block; }
      #primary { flex: 1 1 600px; min-width: 0; max-width: 1120px; }
      #secondary-inner { position: relative; width: 100%; }
      ytd-engagement-panel-section-list-renderer { display: block; padding: 16px; background: #eee; }
      ytd-engagement-panel-section-list-renderer:not([visibility="ENGAGEMENT_PANEL_VISIBILITY_EXPANDED"]) { display: none; }
      #expandable-metadata { padding-top: 12px; }
      #player { position: relative; width: 100%; aspect-ratio: 16 / 9; background: linear-gradient(135deg, #ea3b66, #285ff0 50%, #ffd85a); }
      #player-container-outer, #player-container-inner, ytd-player, ytd-player > #container { display: block; width: 100%; height: 100%; }
      .html5-video-player { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; border-radius: 12px; }
      .html5-video-container, video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
      #cinematics { position: absolute; inset: 0; box-shadow: 0 0 32px 24px #284a80; filter: blur(24px); background: #284a80; z-index: -1; }
      .ytp-chrome-bottom { opacity: 0; position: absolute; bottom: 12px; left: 12px; width: calc(100% - 24px); }
      .native-controls-active .ytp-chrome-bottom { opacity: 1; }
      .html5-video-player.ytp-fullscreen { position: fixed; inset: 0; width: 100vw; height: 100vh; border-radius: 0; }
      html:has(:fullscreen), html:has(:fullscreen) body { overflow: hidden; }

      .ytp-ce-element, .ytp-endscreen-content, .ytp-autonav-endscreen, .ytp-fullscreen-grid { position: absolute; inset: 20%; padding: 20px; background: #000; color: #fff; }
      .ytp-play-button { position: absolute; z-index: 1; inset: 50% auto auto 50%; transform: translate(-50%, -50%); }
      ytd-watch-metadata { display: block; padding-top: 16px; color: #fff; font: 16px Arial, sans-serif; }
      ytd-watch-metadata h1 { margin: 0 0 16px; font-size: 22px; }
      #description { margin-top: 16px; border-radius: 12px; padding: 14px; }
      #secondary { flex: 0 1 360px; min-width: 0; width: 360px; padding: 20px; background: #222; color: #fff; }
      #comments { display: block; margin-top: 24px; padding: 20px; background: #222; color: #fff; }
    </style>
  </head>
  <body>
    <ytd-app>
      <div id="masthead-container">
        <ytd-masthead>
          <div id="container">
            <div id="start">YouTube</div>
            <div id="center">
              <yt-searchbox class="ytSearchboxComponentHost" role="search">
                <input class="ytSearchboxComponentInput" aria-label="Search" placeholder="Search">
                <button class="ytSearchboxComponentSearchButton" aria-label="Search">⌕</button>
              </yt-searchbox>
            </div>
            <div id="voice-search-button">Voice</div>
            <div id="end"><button id="ai-companion-button" data-open-panel="gemini">Gemini</button> · Account</div>
          </div>
        </ytd-masthead>
      </div>
      <ytd-page-manager>
        <ytd-watch-flexy>
          <div id="columns">
            <div id="primary">
              <div id="player-container-outer"><div id="player-container-inner"><div id="player"><div id="cinematics"></div>
                <ytd-player><div id="container"><div id="movie_player" class="html5-video-player" data-test-kind="video" tabindex="0" >
                <div class="html5-video-container" >
                <video class="html5-main-video" preload="auto" src="/test-media.webm" ></video></div>
                <div class="ytp-ce-element" data-test-kind="end-card">End-screen card</div>
                <div class="ytp-endscreen-content" data-test-kind="recommendation-wall">Recommended videos</div>
                <div class="ytp-autonav-endscreen" data-test-kind="autoplay-recommendation">Up next</div>
                <div class="ytp-fullscreen-grid" data-test-kind="modern-recommendation-grid">
                  <div class="ytp-fullscreen-grid-main-content">
                    <div class="ytp-fullscreen-grid-stills-container">
                      <a class="ytp-modern-videowall-still ytp-suggestion-set" data-test-kind="modern-recommendation">Modern recommended video</a>
                    </div>
                  </div>
                </div>
                <div class="ytp-chrome-bottom" >
                  <div class="ytp-progress-bar-container" style="width:100%;height:8px;background:red"></div>
                  <div class="ytp-chrome-controls" style="display:flex;justify-content:space-between">
                    <button class="ytp-play-button" data-test-kind="replay" style="position:static;transform:none">Replay</button>
                    <button class="ytp-fullscreen-button">Fullscreen</button>
                  </div>
                </div>
                </div></div></ytd-player>
              </div></div></div>
              <div id="below">
                <div class="box">
                  <ytd-watch-metadata>
                    <h1>Video title</h1>
                    <div>Channel · Subscribe · Like · Share · Save</div>
                    <div id="description">Description, views and publication date.
                      <div id="expandable-metadata"><button data-open-panel="chapters">Show chapters</button></div>
                      <button data-open-panel="gemini">Ask Gemini</button>
                    </div>
                  </ytd-watch-metadata>
                </div>
                <div class="box">
                  <ytd-comments id="comments" data-test-kind="comments">Comments <div contenteditable="true" role="textbox" aria-label="Add a comment"></div></ytd-comments>
                </div>
              </div>
            </div>
            <div id="secondary" data-test-kind="recommendations">
              <div id="secondary-inner">
                <div id="related">Recommended videos</div>
                <ytd-engagement-panel-section-list-renderer data-panel="chapters" visibility="ENGAGEMENT_PANEL_VISIBILITY_HIDDEN">
                  <h2>Chapters</h2><button data-close-panel>Close chapters</button>
                  <button data-seek="60">Chapter 2 — 1:00</button>
                </ytd-engagement-panel-section-list-renderer>
                <ytd-engagement-panel-section-list-renderer data-panel="gemini" visibility="ENGAGEMENT_PANEL_VISIBILITY_HIDDEN">
                  <h2>Gemini</h2><button data-close-panel>Close Gemini</button>
                  <label>Ask about this video <input id="gemini-question"></label><button id="gemini-send">Ask</button>
                  <output id="gemini-answer"></output>
                </ytd-engagement-panel-section-list-renderer>
              </div>
            </div>
          </div>
        </ytd-watch-flexy>
      </ytd-page-manager>
    </ytd-app>
    <script>
      // Model native YouTube handlers; the extension must leave them reachable.
      const panels = document.querySelectorAll('[data-panel]');
      document.querySelectorAll('[data-open-panel]').forEach(button => {
        button.addEventListener('click', () => panels.forEach(panel => {
          panel.setAttribute('visibility', panel.dataset.panel === button.dataset.openPanel
            ? 'ENGAGEMENT_PANEL_VISIBILITY_EXPANDED' : 'ENGAGEMENT_PANEL_VISIBILITY_HIDDEN');
        }));
      });
      document.querySelectorAll('[data-close-panel]').forEach(button => {
        button.addEventListener('click', () => button.closest('[data-panel]').setAttribute('visibility', 'ENGAGEMENT_PANEL_VISIBILITY_HIDDEN'));
      });
      const player = document.querySelector('#player');
      const video = player.querySelector('video');
      const nativePlayer = document.querySelector('#movie_player');
      nativePlayer.dataset.nativeKeyCount = '0';
      nativePlayer.addEventListener('keydown', event => {
        nativePlayer.classList.add('native-controls-active');
        if (event.repeat && ['m', ' '].includes(event.key)) { event.preventDefault(); event.stopImmediatePropagation(); return; }
        nativePlayer.dataset.nativeKeyCount = String(Number(nativePlayer.dataset.nativeKeyCount) + 1);
        if (event.key === 'ArrowLeft') video.currentTime = Math.max(0, video.currentTime - 5);
        else if (event.key === 'ArrowRight') video.currentTime = Math.min(video.duration, video.currentTime + 5);
        else if (event.key === 'ArrowUp') video.volume = Math.min(1, Math.round((video.volume + 0.05) * 100) / 100);
        else if (event.key === 'ArrowDown') video.volume = Math.max(0, Math.round((video.volume - 0.05) * 100) / 100);
        else if (event.key === 'm') video.muted = !video.muted;
        else if (event.key === ' ') { if (video.paused) video.play(); else video.pause(); }
        else return;
        event.preventDefault(); event.stopImmediatePropagation();
      });
      document.addEventListener('fullscreenchange', () => {
        const active = Boolean(document.fullscreenElement);
        document.querySelector('ytd-watch-flexy').toggleAttribute('fullscreen', active);
        document.querySelector('#movie_player').classList.toggle('ytp-fullscreen', active);
      });
      document.querySelector('[data-seek]').addEventListener('click', event => {
        video.currentTime = Number(event.target.dataset.seek);
      });
      document.querySelector('#gemini-send').addEventListener('click', () => {
        document.querySelector('#gemini-answer').textContent = 'Question received: ' + document.querySelector('#gemini-question').value;
      });
    </script>
    <script src="../content.js"></script>
  </body>
</html>
